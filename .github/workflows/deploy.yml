name: Build & Deploy

# main への push（記事の追加・更新）/ 1時間ごと（予約公開の記事を反映）/ 手動実行
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || 'G-09WE1G90CT' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    # Cloudflare Pages に公開する。リポジトリ変数 CLOUDFLARE_PAGES_PROJECT が設定済みで、PR以外のときだけ動く
    # 事前に Secrets へ CLOUDFLARE_API_TOKEN（権限: Cloudflare Pages の編集）と CLOUDFLARE_ACCOUNT_ID を登録する
    # main は本番、それ以外のブランチ（手動実行時）はプレビューとして公開される
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
